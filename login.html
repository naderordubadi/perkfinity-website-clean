<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Perkfinity — Merchant Sign In</title>
  <meta name="description" content="Sign in to your Perkfinity Merchant Dashboard."/>
  <link rel="icon" href="assets/Perkfinity-App-Icon.png"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .login-container {
      max-width: 480px;
      margin: 80px auto;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    .form-row { margin-bottom: 24px; }
    .form-row label { display: block; font-weight: 700; color: var(--purpleDark); margin-bottom: 8px; font-size: 15px; }
    .form-row input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      font-size: 16px;
      outline: none;
      transition: all 0.2s ease;
      box-sizing: border-box;
      background: #fdfdfd;
    }
    .form-row input:focus { border-color: var(--purple); background: #fff; box-shadow: 0 0 0 4px rgba(91,63,165,0.1); }
    .error-box { display: none; padding: 14px; background: rgba(220,53,69,0.1); color: #dc3545; border-radius: 10px; font-size: 14px; margin-bottom: 20px; font-weight: 600; text-align: center; }
  </style>
  <script src="/config.js"></script>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="Perkfinity home">
        <img src="assets/Perkfinity-Logo.png" alt="Perkfinity logo">
      </a>
      <nav class="nav" aria-label="Primary navigation">
        <a href="members.html">For Members</a>
        <a href="merchants.html">For Merchants</a>
        
        <a href="signup.html">Merchant Sign Up / Sign In</a>
        <a href="how-it-works.html">How it Works</a>
      </nav>
      <a class="btn btn-green" href="mailto:hello@perkfinity.net" aria-label="Contact Us">
        <span aria-hidden="true" style="display:inline-grid;place-items:center;width:20px;height:20px;border-radius:7px;background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.22);">✉</span> Contact Us
      </a>
    </div>
  </header>

  <main class="container">
    <div class="login-container">
      <div style="text-align:center; margin-bottom: 30px;">
        <h1 style="font-size: 28px; color: var(--purpleDark); margin-bottom: 8px;">Welcome Back</h1>
        <p style="color: var(--muted); font-size: 16px;">Sign in to your Merchant Dashboard</p>
      </div>

      <div id="loginError" class="error-box"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-row">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="name@store.com" required>
        </div>
        <div class="form-row">
          <label style="display:flex; justify-content:space-between;">
            Password 
            <a href="#" onclick="handleForgotPassword(event)" style="font-weight:normal; font-size:13px; color:var(--purple); text-decoration:none;">Forgot password?</a>
          </label>
          <div style="position:relative">
            <input type="password" id="password" placeholder="Enter your password" required style="padding-right:45px;width:100%;box-sizing:border-box;">
            <span onclick="togglePassword('password', this)" style="position:absolute;right:15px;top:50%;transform:translateY(-50%);cursor:pointer;opacity:0.6;font-size:18px;user-select:none;">👁️</span>
          </div>
        </div>
        <button type="submit" id="submitBtn" class="btn btn-purple" style="width: 100%; font-size: 16px; padding: 16px;">
          Sign In
        </button>
      </form>

      <div style="text-align:center; margin-top: 24px; font-size: 14px; color: var(--muted);">
        Don't have an account? <a href="signup.html" style="color:var(--purple); font-weight:700; text-decoration:none;">Sign up here</a>
      </div>
    </div>
  </main>

  <script>
    const BACKEND_URL = PerkfinityConfig.BACKEND_URL;

    function togglePassword(inputId, icon) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerText = '🙈';
      } else {
        input.type = 'password';
        icon.innerText = '👁️';
      }
    }

    async function handleForgotPassword(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const errorBox = document.getElementById('loginError');

      if (!email) {
        errorBox.style.background = 'rgba(220,53,69,0.1)';
        errorBox.style.color = '#dc3545';
        errorBox.innerText = 'Please enter your email address first to reset your password.';
        errorBox.style.display = 'block';
        document.getElementById('email').focus();
        return;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        errorBox.style.background = 'rgba(220,53,69,0.1)';
        errorBox.style.color = '#dc3545';
        errorBox.innerText = 'Please enter a valid email address (e.g. name@example.com).';
        errorBox.style.display = 'block';
        document.getElementById('email').focus();
        return;
      }

      errorBox.style.display = 'none';
      const submitBtn = document.getElementById('submitBtn');
      const originalText = submitBtn.innerText;
      submitBtn.innerText = 'Sending link...';
      submitBtn.disabled = true;

      try {
        const res = await fetch(`${BACKEND_URL}/api/v1/merchants/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        
        const data = await res.json();
        if (res.ok && data.success) {
          errorBox.style.background = 'rgba(40, 167, 69, 0.1)';
          errorBox.style.color = '#28a745';
          errorBox.innerText = data.message;
          errorBox.style.display = 'block';
        } else {
          throw new Error(data.error || 'Failed to send reset link');
        }
      } catch (err) {
        errorBox.style.background = 'rgba(220,53,69,0.1)';
        errorBox.style.color = '#dc3545';
        errorBox.innerText = err.message || "Something went wrong.";
        errorBox.style.display = 'block';
      } finally {
        submitBtn.innerText = originalText;
        submitBtn.disabled = false;
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorBox = document.getElementById('loginError');
      const submitBtn = document.getElementById('submitBtn');

      errorBox.style.display = 'none';
      submitBtn.innerText = 'Signing in...';
      submitBtn.disabled = true;
      submitBtn.style.opacity = '0.7';

      try {
        const res = await fetch(`${BACKEND_URL}/api/v1/merchants/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        let data;
        try {
          data = await res.json();
        } catch(err) {
          throw new Error('Invalid JSON response from server');
        }

        if (res.ok && data.success) {
          // Store token and merchant data in localStorage
          localStorage.setItem('perkfinity_token', data.data.accessToken);
          localStorage.setItem('perkfinity_merchant_id', data.data.merchantUser.merchant_id);
          localStorage.setItem('perkfinity_business_name', data.data.merchantUser.business_name);
          localStorage.setItem('perkfinity_email', data.data.merchantUser.email);
          if (data.data.merchantUser.logo_url) {
            localStorage.setItem('perkfinity_logo_url', data.data.merchantUser.logo_url);
          } else {
            localStorage.removeItem('perkfinity_logo_url');
          }

          if (data.data.setup_incomplete) {
            // Account created but payment info was never saved — resume signup flow
            localStorage.setItem('perkfinity_setup_incomplete', 'true');
            window.location.href = 'signup.html?resume=true';
          } else {
            localStorage.removeItem('perkfinity_setup_incomplete');
            window.location.href = 'dashboard.html';
          }
        } else {
          throw new Error(data.message || 'Invalid email or password');
        }
      } catch (err) {
        errorBox.innerText = err.message || "Something went wrong. Please try again.";
        errorBox.style.display = 'block';
        console.error('Login error:', err);
      } finally {
        submitBtn.innerText = 'Sign In';
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
      }
    }
  </script>
</body>
</html>
