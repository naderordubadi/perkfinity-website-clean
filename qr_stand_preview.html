<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      align-items: center;
      background: #1e293b;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #334155;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover {
      background: #475569;
    }
    .btn.active {
      background: #7c3aed;
      border-color: #a855f7;
      color: #fff;
    }
    .print-btn {
      background: #16a34a;
      border-color: #22c55e;
      margin-left: 12px;
    }
    .print-btn:hover {
      background: #15803d;
    }
    .preview-stage {
      background: #334155;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
      max-width: 100%;
    }
    .print-sheet-container {
      width: 11in;
      height: 8.5in;
      display: flex;
      flex-direction: row;
      position: relative;
      background: #fff;
      box-sizing: border-box;
      overflow: hidden;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    @media print {
      body {
        background: transparent !important;
        padding: 0 !important;
      }
      .toolbar {
        display: none !important;
      }
      .preview-stage {
        background: transparent !important;
        padding: 0 !important;
        box-shadow: none !important;
      }
      .print-sheet-container {
        box-shadow: none !important;
      }
