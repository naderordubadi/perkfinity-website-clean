<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Perkfinity — Member Password Reset</title>
  <meta name="description" content="Reset your Perkfinity member password."/>
  <link rel="icon" href="assets/Perkfinity-App-Icon.png"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .login-container {
      max-width: 480px;
      margin: 80px auto;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    .form-row { margin-bottom: 24px; }
    .form-row label { display: block; font-weight: 700; color: var(--purpleDark); margin-bottom: 8px; font-size: 15px; }
    .form-row input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      font-size: 16px;
      outline: none;
      transition: all 0.2s ease;
      box-sizing: border-box;
      background: #fdfdfd;
    }
    .form-row input:focus { border-color: var(--purple); background: #fff; box-shadow: 0 0 0 4px rgba(91,63,165,0.1); }
    .error-box { display: none; padding: 14px; background: rgba(220,53,69,0.1); color: #dc3545; border-radius: 10px; font-size: 14px; margin-bottom: 20px; font-weight: 600; text-align: center; }
  </style>
  <script src="/config.js"></script>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="Perkfinity home">
        <img src="assets/Perkfinity-Logo.png" alt="Perkfinity logo">
      </a>
      <a class="btn btn-green" href="mailto:hello@perkfinity.net" aria-label="Contact Us">
        <span aria-hidden="true" style="display:inline-grid;place-items:center;width:20px;height:20px;border-radius:7px;background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.22);">✉</span> Contact Us
      </a>
    </div>
  </header>

  <main class="container">
    <div class="login-container">
      <div style="text-align:center; margin-bottom: 30px;">
        <h1 style="font-size: 28px; color: var(--purpleDark); margin-bottom: 8px;">Reset App Password</h1>
        <p style="color: var(--muted); font-size: 16px;">Choose a new password for your Perkfinity app account.</p>
      </div>

      <div id="resetError" class="error-box"></div>

      <form id="resetForm" onsubmit="handleReset(event)">
        <div class="form-row">
          <label>New Password</label>
          <div style="position:relative">
            <input type="password" id="password" placeholder="Enter new password" required style="padding-right:45px;width:100%;box-sizing:border-box;">
            <span onclick="togglePassword('password', this)" style="position:absolute;right:15px;top:50%;transform:translateY(-50%);cursor:pointer;opacity:0.6;font-size:18px;user-select:none;">👁️</span>
          </div>
        </div>
        <button type="submit" id="submitBtn" class="btn btn-purple" style="width: 100%; font-size: 16px; padding: 16px;">
          Set New Password
        </button>
      </form>
    </div>
  </main>

  <script>
    const BACKEND_URL = PerkfinityConfig.BACKEND_URL;

    function togglePassword(inputId, icon) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerText = '🙈';
      } else {
        input.type = 'password';
        icon.innerText = '👁️';
      }
    }

    async function handleReset(e) {
      e.preventDefault();
      
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      const password = document.getElementById('password').value;
      const errorBox = document.getElementById('resetError');
      const submitBtn = document.getElementById('submitBtn');

      if (!token) {
        errorBox.innerText = 'Invalid link. Missing reset token.';
        errorBox.style.display = 'block';
        return;
      }

      if (password.length < 8) {
        errorBox.innerText = 'Password must be at least 8 characters long.';
        errorBox.style.display = 'block';
        return;
      }

      errorBox.style.display = 'none';
      submitBtn.innerText = 'Resetting password...';
      submitBtn.disabled = true;
      submitBtn.style.opacity = '0.7';

      try {
        const res = await fetch(`${BACKEND_URL}/api/v1/consumers/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        
        const data = await res.json();
        if (res.ok && data.success) {
          errorBox.style.background = 'rgba(40, 167, 69, 0.1)';
          errorBox.style.color = '#28a745';
          errorBox.innerHTML = `<strong>Success!</strong><br><br>Your password has been reset successfully. You can now close this window and log back into the Perkfinity app on your phone.`;
          errorBox.style.display = 'block';
          document.getElementById('resetForm').style.display = 'none';
        } else {
          throw new Error(data.error || 'Failed to reset password');
        }
      } catch (err) {
        errorBox.style.background = 'rgba(220,53,69,0.1)';
        errorBox.style.color = '#dc3545';
        errorBox.innerText = err.message || "Something went wrong. Please try again.";
        errorBox.style.display = 'block';
        submitBtn.innerText = 'Set New Password';
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
      }
    }
  </script>
</body>
</html>
